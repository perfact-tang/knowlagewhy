[project]
name = "knowlagewhy"
version = "0.1.0"
description = "Local multi-agent knowledge investigation workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "ddgs>=9,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mini-swe-agent==2.4.6",
  "neo4j>=6,<7",
  "pydantic-settings>=2,<3",
  "python-multipart>=0.0.22,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 105

[tool.pytest.ini_options]
pythonpath = ["."]
